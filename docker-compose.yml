# Local dev stack: Postgres + MinIO standing in for Serverless SQL and Object Storage.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: croft
      POSTGRES_PASSWORD: croft
      POSTGRES_DB: croft
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: croft
      MINIO_ROOT_PASSWORD: croftcroft
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  minio-init:
    image: minio/mc
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 croft croftcroft; do sleep 1; done;
      mc mb -p local/croft-artifacts;
      mc anonymous set download local/croft-artifacts;
      "

volumes:
  pgdata:
  miniodata:
